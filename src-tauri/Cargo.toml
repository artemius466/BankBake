[package]
name = "bankbake"
version = "1.0.0"
description = "Lightweight FMOD Bank Compiler & Audio Converter"
authors = ["BankBake"]
edition = "2021"

[lib]
name = "bankbake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
walkdir = "2"
anyhow = "1"
